# docker-compose.yml — app + postgres + Caddy reverse proxy
# agm.mywavewake.ru: nginx (prod) или Caddy → BasicAuth → app (X-API-Key прокидывается автоматически)
#
# Профили образа app (см. docs/CANONICAL-RUNTIME.md):
#   DOCKER_BUILD_TARGET=lite  — office-lite, rule_based (по умолчанию)
#   DOCKER_BUILD_TARGET=full  — office-full, crewai; задайте ORCHESTRATION_ENGINE=auto и OPENAI_API_KEY в .env
# Prod RU (CrewAI norm): docker compose -f docker-compose.yml -f docker-compose.server-full.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_BUILD_TARGET:-lite}
      args:
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-unknown}
    env_file:
      - .env
    environment:
      # lite default = rule_based (образ без crewai). Office-full: DOCKER_BUILD_TARGET=full + ORCHESTRATION_ENGINE=auto.
      # При engine=auto код включает CrewAI только если есть OPENAI_API_KEY/BASE_URL (иначе быстрый fallback).
      ORCHESTRATION_ENGINE: ${ORCHESTRATION_ENGINE:-rule_based}
      DATABASE_URL: postgresql+psycopg2://mywave:${POSTGRES_PASSWORD}@postgres:5432/mywave_ai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: mywave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mywave_ai
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      TELEGRAM_STAGE_NOTIFY: ${TELEGRAM_STAGE_NOTIFY:-false}
      ORCHESTRATION_ALLOW_FALLBACK: ${ORCHESTRATION_ALLOW_FALLBACK:-true}
      LLM_TIER_DEFAULT: ${LLM_TIER_DEFAULT:-local}
      LLM_LOCAL_BASE_URL: ${LLM_LOCAL_BASE_URL:-}
      LLM_LOCAL_API_KEY: ${LLM_LOCAL_API_KEY:-ollama}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-}
      LLM_LOCAL_PROVIDER: ${LLM_LOCAL_PROVIDER:-openai}
      LLM_CLOUD_BASE_URL: ${LLM_CLOUD_BASE_URL:-}
      LLM_CLOUD_API_KEY: ${LLM_CLOUD_API_KEY:-}
      LLM_CLOUD_MODEL: ${LLM_CLOUD_MODEL:-}
      CREWAI_MODEL: ${CREWAI_MODEL:-}
      CREWAI_DEFAULT_MODEL: ${CREWAI_DEFAULT_MODEL:-}
      CREWAI_PROVIDER: ${CREWAI_PROVIDER:-openai}
      CREWAI_TIMEOUT: ${CREWAI_TIMEOUT:-120}
      CREWAI_MAX_TOKENS: ${CREWAI_MAX_TOKENS:-8192}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-unknown}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./app/artifacts:/app/app/artifacts
    # create_all() не добавляет колонки к уже существующим таблицам — нужны миграции Alembic
    # После reboot postgres может ответить на health раньше, чем примет соединения — ретраи alembic.
    command:
      [
        "sh",
        "-c",
        "i=0; until alembic upgrade head; do i=$$((i+1)); if [ $$i -ge 15 ]; then echo 'alembic failed'; exit 1; fi; echo \"alembic retry $$i/15\"; sleep 2; done; exec python -m app.main",
      ]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mywave_ai
      POSTGRES_USER: mywave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mywave -d mywave_ai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      OWNER_API_KEY: ${OWNER_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
